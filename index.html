<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secret Office - 秘書との秘めやかな夜</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #090a0f;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Meiryo', 'メイリオ', 'Hiragino Kaku Gothic ProN', sans-serif;
    color: #e2e8f0;
    padding: 10px;
  }

  #novel-container {
    width: 100%;
    max-width: 480px;
    background: #12151f;
    border: 1px solid rgba(212, 175, 55, 0.25);
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(212, 175, 55, 0.08);
    border-radius: 4px;
    padding: 18px 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  /* ヘッダー */
  .novel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    letter-spacing: 1.5px;
    color: #d4af37;
    border-bottom: 1px solid rgba(212, 175, 55, 0.2);
    padding-bottom: 8px;
  }

  /* パラメータリボン */
  .stats-ribbon {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 4px;
    background: #0a0d14;
    padding: 8px 6px;
    border-left: 3px solid #d4af37;
    text-align: center;
    font-size: 10.5px;
  }

  .stat-col {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .stat-label {
    color: #94a3b8;
  }

  .stat-val {
    font-size: 13px;
    font-weight: bold;
    color: #f8fafc;
  }

  /* 本文表示枠 */
  .novel-viewport {
    min-height: 220px;
    max-height: 300px;
    overflow-y: auto;
    border-top: 1px solid #1e2433;
    border-bottom: 1px solid #1e2433;
    padding: 14px 4px;
    position: relative;
  }

  /* なめらかなフェードインアニメーション */
  .fade-in {
    animation: fadeInText 0.35s ease-out forwards;
  }

  @keyframes fadeInText {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .text-flow {
    font-size: 13.5px;
    line-height: 1.9;
    letter-spacing: 0.5px;
    color: #cbd5e1;
  }

  /* 点滅するカーソル演出 */
  .cursor {
    display: inline-block;
    width: 7px;
    height: 14px;
    background: #d4af37;
    margin-left: 3px;
    vertical-align: middle;
    animation: blink 0.8s infinite;
  }

  @keyframes blink {
    0%, 50% { opacity: 1; }
    51%, 100% { opacity: 0; }
  }

  .char-name {
    color: #d4af37;
    font-weight: bold;
    margin-bottom: 4px;
    display: inline-block;
  }

  /* 選択肢ボタン */
  .choice-container {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  button.choice-btn {
    background: #171b28;
    color: #cbd5e1;
    border: 1px solid #283046;
    padding: 11px 14px;
    font-size: 12.5px;
    text-align: left;
    font-family: inherit;
    letter-spacing: 0.3px;
    cursor: pointer;
    transition: all 0.25s ease;
    border-radius: 2px;
    line-height: 1.4;
  }

  button.choice-btn:hover:not(:disabled) {
    background: #22293d;
    color: #ffffff;
    border-color: #d4af37;
    padding-left: 18px;
  }

  button.choice-btn:disabled {
    background: #0d1017 !important;
    color: #475569 !important;
    border-color: #171c26 !important;
    cursor: not-allowed;
    opacity: 0.6;
  }
</style>
</head>
<body>

<div id="novel-container">
  <div class="novel-header">
    <span id="turn-txt">Chapter 1 ／ 残り 12 ターン</span>
    <span>PM 21:40 役員フロア</span>
  </div>

  <div class="stats-ribbon">
    <div class="stat-col"><span class="stat-label">決断力</span><span class="stat-val" id="stat-leader">10</span></div>
    <div class="stat-col"><span class="stat-label">余裕</span><span class="stat-val" id="stat-elegance">10</span></div>
    <div class="stat-col"><span class="stat-label">気配り</span><span class="stat-val" id="stat-care">10</span></div>
    <div class="stat-col"><span class="stat-label">ストレス</span><span class="stat-val" id="stat-stress" style="color:#f87171;">0</span></div>
    <div class="stat-col"><span class="stat-label">親密度</span><span class="stat-val" id="stat-love" style="color:#d4af37;">10</span></div>
  </div>

  <div class="novel-viewport" id="viewport">
    <div id="story-text" class="text-flow"></div>
  </div>

  <div class="choice-container" id="choice-box">
    <button class="choice-btn" onclick="act('leader')">１．「この事業計画書だけ通す」と鋭くペンを走らせる</button>
    <button class="choice-btn" onclick="act('elegance')">２．「君の淹れてくれた珈琲を飲むまではね」と微笑む</button>
    <button class="choice-btn" onclick="act('care')">３．「怜さんも遅くまで悪いね、無理はしないで」と労う</button>
    <button class="choice-btn" onclick="act('rest')">４．ネクタイを緩め、窓辺の夜景を見つめながら一息つく</button>
  </div>
</div>

<script>
let turnsLeft = 12;
let leader = 10;
let elegance = 10;
let care = 10;
let stress = 0;
let love = 10;
let isTyping = false;
let typeTimer = null;

// なめらかな1文字ずつのタイピング送り演出
function typeWriter(htmlString, callback) {
  const target = document.getElementById('story-text');
  const viewport = document.getElementById('novel-viewport') || document.getElementById('viewport');
  target.innerHTML = '';
  target.classList.remove('fade-in');
  void target.offsetWidth; // リフロー発生
  target.classList.add('fade-in');

  if (typeTimer) clearInterval(typeTimer);

  // ボタンを文字送り中は無効化（誤操作防止）
  isTyping = true;
  toggleButtons(false);

  let i = 0;
  let currentHTML = '';
  const speed = 18; // 文字送り速度（ミリ秒）

  typeTimer = setInterval(() => {
    if (i < htmlString.length) {
      // HTMLタグ（<br>, <span>など）は分割せず一括で処理
      if (htmlString[i] === '<') {
        const tagEnd = htmlString.indexOf('>', i);
        if (tagEnd !== -1) {
          currentHTML += htmlString.substring(i, tagEnd + 1);
          i = tagEnd + 1;
        } else {
          currentHTML += htmlString[i];
          i++;
        }
      } else {
        currentHTML += htmlString[i];
        i++;
      }
      target.innerHTML = currentHTML + '<span class="cursor"></span>';
      viewport.scrollTop = viewport.scrollHeight;
    } else {
      clearInterval(typeTimer);
      typeTimer = null;
      target.innerHTML = currentHTML; // カーソル消去
      isTyping = false;
      if (turnsLeft > 0) {
        toggleButtons(true);
      }
      if (callback) callback();
    }
  }, speed);
}

function toggleButtons(enabled) {
  const buttons = document.querySelectorAll('#choice-box button');
  buttons.forEach(b => {
    b.disabled = !enabled;
  });
}

function updateView() {
  document.getElementById('turn-txt').innerText = `Chapter ${13 - turnsLeft} ／ 残り ${turnsLeft} ターン`;
  document.getElementById('stat-leader').innerText = leader;
  document.getElementById('stat-elegance').innerText = elegance;
  document.getElementById('stat-care').innerText = care;
  document.getElementById('stat-stress').innerText = stress;
  document.getElementById('stat-love').innerText = love;
}

function act(type) {
  if (turnsLeft <= 0 || isTyping) return;

  // 過労イベント
  if (stress >= 65 && type !== 'rest') {
    stress = Math.max(0, stress - 30);
    turnsLeft--;
    const text = '【疲労困憊】<br><br>' +
      'こめかみに鋭い頭痛が走り、デスクに突っ伏してしまった。<br><br>' +
      '<span class="char-name">桐島 怜</span><br>' +
      '「……社長！？ 無理をしすぎです。今夜はこれ以上の仕事はお止めください。<br>' +
      'スケジュールは私が調整しますから……。」<br><br>' +
      '冷たい指先が額に触れ、彼女の微かな香水の香りが漂った。';
    updateView();
    typeWriter(text, checkEnding);
    return;
  }

  let text = '';
  if (type === 'leader') {
    leader += 8;
    stress += 10;
    text = '妥協のない判断力で数々の課題を一気に片付けた。<br>' +
           '（決断力＋8 ／ ストレス＋10）<br><br>';
    if (Math.random() < 0.5) {
      love += 6;
      text += '<span class="char-name">桐島 怜</span><br>' +
              '「お見事です。迷いのないその判断……秘書として誇らしく思います。<br>' +
              '……でも、たまには部下に頼ることも覚えてくださいね。」';
    } else {
      text += '<span class="char-name">桐島 怜</span><br>' +
              '「迅速なご決断ですが、少し詰め込みすぎでは？ ご自分を追い込みすぎです。」';
    }
  } else if (type === 'elegance') {
    elegance += 8;
    stress += 8;
    text = '珈琲を受け取りながら、大人の余裕を漂わせた視線を交わした。<br>' +
           '（余裕＋8 ／ ストレス＋8）<br><br>';
    if (Math.random() < 0.5) {
      love += 6;
      text += '<span class="char-name">桐島 怜</span><br>' +
              '「ふふ……口の上手な上司を持つと、秘書は苦労します。<br>' +
              '……ですが、嫌いではありませんよ。そういうところ。」<br><br>' +
              '彼女は眼鏡を少し指で押し上げ、小さく微笑んだ。';
    } else {
      text += '<span class="char-name">桐島 怜</span><br>' +
              '「からかわないでください。冷めないうちにどうぞ。」';
    }
  } else if (type === 'care') {
    care += 8;
    stress += 6;
    text = '彼女の肩にかかる負担を察し、優しい言葉をかけて労った。<br>' +
           '（気配り＋8 ／ ストレス＋6）<br><br>';
    if (Math.random() < 0.5) {
      love += 6;
      text += '<span class="char-name">桐島 怜</span><br>' +
              '「私への気遣いですか……？<br>' +
              'いつも周囲ばかり見ているあなたにそう言われると……少し、胸が痛みますね。<br>' +
              '……ありがとうございます。」';
    } else {
      text += '<span class="char-name">桐島 怜</span><br>' +
              '「これが私の仕事ですから。お気になさらないでください。」';
    }
  } else if (type === 'rest') {
    stress = Math.max(0, stress - 35);
    text = '椅子に深く背を預け、眼下に広がる摩天楼の灯りをぼんやりと眺めた。<br>' +
           '彼女が静かに注ぎ直してくれたハーブティーの香りが、神経を解きほぐしていく。<br><br>' +
           '（深呼吸とともに、溜まっていた疲労が大幅に回復した）';
  }

  turnsLeft--;
  updateView();
  typeWriter(text, checkEnding);
}

function checkEnding() {
  if (turnsLeft > 0) return;

  toggleButtons(false);

  setTimeout(() => {
    const isTrue = (leader >= 35 && elegance >= 35 && care >= 35 && love >= 35);
    const isGood = (love >= 25);
    let endText = '';

    if (isTrue) {
      endText = `
        <span style="color:#d4af37; font-weight:bold; font-size:14px;">【True End：午前零時のバーカウンター】</span><br><br>
        オフィスを出た後、どちらからともなくホテル最上階のラウンジへ向かった。<br><br>
        並んで傾けるマティーニのグラス。<br>
        いつものビジネスライクな表情を解いた怜が、微かに頬を染めてこちらを見つめる。<br><br>
        <span class="char-name">桐島 怜</span><br>
        「……もう執務時間は終わりました。これからは上司と秘書ではなく、一人の男の人として見てもいいですか？」<br><br>
        重なり合う視線の先に、夜景の光が静かに揺れていた。<br><br>
        <b style="color:#d4af37;">▶ TRUE END（秘書から特別なパートナーへ）</b>
      `;
    } else if (isGood) {
      endText = `
        <span style="color:#93c5fd; font-weight:bold; font-size:14px;">【Good End：雨のタクシー乗り場】</span><br><br>
        ビルを出ると、雨は小降りになっていた。<br>
        傘をたたむ彼女をタクシーへエスコートする。<br><br>
        <span class="char-name">桐島 怜</span><br>
        「今夜はお疲れ様でした。あなたを一番近くで支えることができて、本当によかったと思っています。<br>
        ……明日も、朝一番にスケジュールをお持ちしますね。」<br><br>
        窓越しに会釈する彼女の瞳には、以前とは違う確かな信頼の色が宿っていた。<br><br>
        ▶ GOOD END（最良のパートナー）
      `;
    } else {
      endText = `
        <span style="color:#94a3b8; font-weight:bold; font-size:14px;">【Normal End：ビジネスの境界線】</span><br><br>
        日付が変わる前、書類の整理を終えた怜が一礼する。<br><br>
        <span class="char-name">桐島 怜</span><br>
        「本日の業務は完了いたしました。それでは失礼いたします、社長。」<br><br>
        冷徹なまでに完璧な一礼を残し、彼女は足早にエレベーターへと消えていった。<br>
        二人きりの夜は、ただの残業として静かに幕を閉じた。<br><br>
        ▶ NORMAL END（割り切った関係）
      `;
    }
    typeWriter(endText);
  }, 400);
}

// 初回起動時のテキスト送り
window.onload = function() {
  const initText = '高層階のオフィスから見下ろす街は、冷たい雨に濡れていた。<br><br>' +
    '静まり返ったフロアに、控えめなノックの音が二度響く。<br>' +
    '入ってきたのは、専属秘書の桐島 怜（きりしま れい）。<br>' +
    '完璧に着こなしたタイトスカートに眼鏡の奥の涼やかな瞳。彼女の手には、湯気の立つ温かいエスプレッソが載せられていた。<br><br>' +
    '<span class="char-name">桐島 怜</span><br>' +
    '「社長、本日の決裁書類は以上で全てです。……まだ、お帰りにならないのですか？」';
  typeWriter(initText);
};
</script>
</body>
</html>
